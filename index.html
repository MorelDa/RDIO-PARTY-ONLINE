<head>

<link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
<title>Radio Party Online</title>
<style>
:root{
  --pink:#ff1591;
  --pink2:#ff2aa0;
  --pink3:#e90078;
  --yellow:#ffe600;
  --yellow2:#fff24a;
  --white:#fff;
  --ink:#151018;
  --muted:rgba(255,255,255,.76);
  --glass:rgba(255,255,255,.12);
  --safe-top:env(safe-area-inset-top);
  --safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--pink);font-family:Arial,Helvetica,sans-serif;color:#fff}
body{position:fixed;inset:0}
button,a{font:inherit}
button{border:0;cursor:pointer}
#app{height:100dvh;width:100%;overflow:hidden;position:relative;background:
 radial-gradient(circle at 18% 10%,rgba(255,255,255,.14),transparent 28%),
 radial-gradient(circle at 85% 75%,rgba(255,0,140,.24),transparent 35%),
 linear-gradient(145deg,#ff0c89 0%,#f80c93 48%,#e70075 100%);
}
#intro{
  position:fixed;inset:0;z-index:100;background:#050505;display:grid;place-items:center;
  transition:opacity .55s ease,visibility .55s ease;
}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#introVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#050505}
.introShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35))}
#introStart{
 position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;
 color:#fff;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.42);
 border-radius:999px;padding:16px 25px 15px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
 box-shadow:0 10px 35px rgba(0,0,0,.35);font-weight:900;letter-spacing:.8px;
 text-transform:uppercase;
}
#introStart .play{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:#111;font-size:21px}
#introStart small{font-size:11px;opacity:.8;font-weight:700;letter-spacing:1.2px}
#introHint{position:absolute;z-index:2;bottom:calc(24px + var(--safe-bottom));font-size:11px;font-weight:700;opacity:.72;text-align:center;padding:0 20px}
.shell{height:100%;display:flex;flex-direction:column;padding:calc(10px + var(--safe-top)) 18px calc(8px + var(--safe-bottom));}
.header{height:52px;display:flex;align-items:center;justify-content:space-between;flex:0 0 52px}
.brandMini{display:flex;align-items:center;gap:10px;min-width:0}
.brandMini img{width:42px;height:42px;border-radius:12px;object-fit:cover;box-shadow:0 5px 15px rgba(0,0,0,.18)}
.brandText{line-height:.9}
.brandText b{display:block;font-size:17px;font-weight:950;letter-spacing:-.5px}
.brandText span{font-size:10px;font-weight:800;opacity:.8;letter-spacing:1.2px}
.liveDot{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:900;letter-spacing:.6px;text-transform:uppercase}
.liveDot i{display:block;width:8px;height:8px;border-radius:50%;background:#65ff83;box-shadow:0 0 0 5px rgba(101,255,131,.13),0 0 12px #65ff83}
.install{display:none;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.24);border-radius:13px;padding:9px 11px;font-size:11px;font-weight:900}
.install.show{display:block}
.content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
.stationCard{
 position:relative;overflow:hidden;border-radius:25px;min-height:0;flex:1;max-height:430px;
 background:linear-gradient(145deg,#ff3aa7,#f87d64 55%,#ffc327);
 box-shadow:0 18px 35px rgba(89,0,54,.2);isolation:isolate;
}
.stationCard:before{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 72% 17%,rgba(255,255,255,.28) 0 2px,transparent 3px) 0 0/18px 18px,
 linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.02));opacity:.55}
.stationCard:after{content:"";position:absolute;width:190px;height:190px;right:-40px;top:-30px;border-radius:50%;background:rgba(255,255,255,.13);filter:blur(1px)}
.cardLogo{position:absolute;inset:7% 7% 18%;display:grid;place-items:center;z-index:1;pointer-events:none}
.cardLogo img{width:min(66%,220px);height:auto;max-height:88%;object-fit:contain;filter:drop-shadow(0 13px 15px rgba(70,0,35,.22))}
.cardBottom{position:absolute;z-index:2;left:18px;right:18px;bottom:15px;display:flex;justify-content:space-between;align-items:end}
.stationTitle{font-size:24px;font-weight:950;letter-spacing:-.7px}
.stationSub{font-size:12px;font-weight:700;opacity:.9;margin-top:4px}
.equalizer{display:flex;gap:3px;height:25px;align-items:end}
.equalizer span{width:3px;background:#fff;border-radius:5px;animation:eq .8s ease-in-out infinite alternate}
.equalizer span:nth-child(1){height:9px}.equalizer span:nth-child(2){height:19px;animation-delay:.2s}.equalizer span:nth-child(3){height:13px;animation-delay:.35s}.equalizer span:nth-child(4){height:23px;animation-delay:.12s}.equalizer span:nth-child(5){height:15px;animation-delay:.3s}
@keyframes eq{to{transform:scaleY(.4);opacity:.65}}
.playerRow{display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:12px}
.nowPlaying{min-width:0}
.nowPlaying .eyebrow{font-size:10px;font-weight:900;letter-spacing:1.4px;opacity:.75;text-transform:uppercase}
.nowPlaying .name{font-size:21px;font-weight:950;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowPlaying .desc{font-size:12px;font-weight:650;opacity:.76;margin-top:3px}
.playBtn{
 width:70px;height:70px;border-radius:50%;flex:0 0 70px;background:#fff;color:var(--pink);
 display:grid;place-items:center;font-size:29px;font-weight:900;
 box-shadow:0 10px 25px rgba(91,0,48,.22),inset 0 -2px 0 rgba(0,0,0,.06);
 position:relative;
}
.playBtn:before{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(255,255,255,.28)}
.playBtn:active{transform:scale(.95)}
.wa{
 width:100%;display:flex;align-items:center;justify-content:center;gap:11px;text-decoration:none;
 border:2px solid rgba(255,255,255,.98);border-radius:999px;color:#fff;
 background:rgba(255,255,255,.06);padding:8px 16px 8px 9px;
 box-shadow:0 8px 18px rgba(87,0,49,.12);font-weight:950;letter-spacing:.5px;
}
.waIcon{width:45px;height:45px;border-radius:50%;background:#25d366;display:grid;place-items:center;color:#fff;flex:0 0 45px;box-shadow:0 3px 9px rgba(0,0,0,.16)}
.waText{text-align:left;line-height:.92}.waText b{display:block;font-size:18px}.waText span{display:block;font-size:12px;color:var(--yellow);margin-top:3px}
.nav{
 height:67px;flex:0 0 67px;border-radius:34px;background:#fff;display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr 1fr;
 align-items:center;padding:0 7px;box-shadow:0 14px 35px rgba(74,0,42,.22);color:#9ca2ae;
}
.nav a,.nav button{background:none;color:inherit;text-decoration:none;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:25px;font-size:9px;font-weight:900}
.nav svg{width:23px;height:23px;stroke:currentColor;stroke-width:2.4;fill:none}
.nav .active{color:var(--pink)}
.nav .request{
 width:65px;height:65px;margin:auto;border-radius:50%;background:var(--yellow);color:#7a0050;
 box-shadow:0 7px 18px rgba(0,0,0,.18);border:6px solid rgba(255,255,255,.9);
 position:relative;top:-8px;font-size:9px;
}
.nav .request svg{width:27px;height:27px}
.toast{position:fixed;z-index:50;left:50%;bottom:94px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:rgba(20,0,15,.86);color:#fff;padding:11px 16px;border-radius:999px;font-size:12px;font-weight:800;transition:.25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){
 .shell{max-width:460px;margin:auto;padding-left:0;padding-right:0}
 .stationCard{max-height:500px}
}
@media (max-height:700px){
 .header{height:44px;flex-basis:44px}
 .brandMini img{width:35px;height:35px}.brandText b{font-size:15px}
 .stationCard{max-height:315px;border-radius:21px}.cardLogo{inset:5% 7% 17%}.cardBottom{bottom:11px}
 .stationTitle{font-size:20px}.playBtn{width:61px;height:61px;flex-basis:61px;font-size:25px}
 .nav{height:59px;flex-basis:59px}.nav .request{width:57px;height:57px}
 .wa{min-height:52px;padding-top:4px;padding-bottom:4px}.waIcon{width:38px;height:38px;flex-basis:38px}.waText b{font-size:16px}
}
</style>
</head>
<body>
<div id="app">
  <section id="intro" aria-label="Introducción">
    <video id="introVideo" playsinline preload="auto" poster="./assets/radio-party-logo.png">
      <source src="./assets/intro.mp4" type="video/mp4">
    </video>
    <div class="introShade"></div>
    <button id="introStart" type="button">
      <span class="play">▶</span>
      <span>TOCAR PARA ENTRAR</span>
      <small>RADIO PARTY ONLINE</small>
    </button>
    <div id="introHint">En una PWA instalada, la intro se reproduce automáticamente.</div>
  </section>

  <main class="shell">
    <header class="header">
      <div class="brandMini">
        <img src="./assets/favicon-transparent.png" alt="Radio Party">
        <div class="brandText"><b>Radio Party</b><span>ONLINE · EN VIVO</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button id="installBtn" class="install" type="button">INSTALAR</button>
        <div class="liveDot"><i></i> En vivo</div>
      </div>
    </header>

    <section class="content">
      <article class="stationCard">
        <div class="cardLogo"><img src="./assets/radio-party-logo-transparent.png" alt="Radio Party Online"></div>
        <div class="cardBottom">
          <div><div class="stationTitle">Radio Party</div><div class="stationSub">Tu música, tu momento.</div></div>
          <div class="equalizer" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
      </article>

      <section class="playerRow">
        <div class="nowPlaying">
          <div class="eyebrow" id="status">Radio Party · En vivo</div>
          <div class="name" id="track">Radio Party</div>
          <div class="desc" id="desc">Pulsa el botón para escuchar la emisión.</div>
        </div>
        <button class="playBtn" id="playBtn" aria-label="Reproducir Radio Party">▶</button>
      </section>

      <a class="wa" id="waLink" href="#" target="_blank" rel="noopener">
        <span class="waIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="27" height="27" fill="currentColor"><path d="M20.5 3.5A11.6 11.6 0 0 0 12.2 0C5.8 0 .6 5.2.6 11.6c0 2 .5 3.9 1.5 5.6L.5 23.8l6.8-1.8c1.5.8 3.2 1.2 4.9 1.2h.1c6.4 0 11.6-5.2 11.6-11.6 0-3.1-1.2-6-3.4-8.1ZM12.2 21c-1.5 0-3-.4-4.3-1.1l-.3-.2-4 1.1 1.1-3.9-.2-.3a9.3 9.3 0 1 1 7.7 4.4Zm5.1-7c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-1.7-.8-2.8-1.4-3.9-3.2-.3-.5.3-.5.8-1.5.1-.2.1-.4 0-.6-.1-.2-.7-1.7-1-2.3-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.7s1.2 3.1 1.4 3.3c.2.2 2.4 3.7 5.8 5.2.8.4 1.5.6 2 .8.8.2 1.6.2 2.2.1.7-.1 1.8-.7 2-1.3.3-.6.3-1.2.2-1.3-.1-.1-.3-.2-.6-.4Z"/></svg>
        </span>
        <span class="waText"><b>ESCRIBÍ</b><span>AL WHATSAPP</span></span>
      </a>
    </section>

    <nav class="nav" aria-label="Navegación">
      <a class="active" href="#" id="homeBtn" aria-label="Inicio">
        <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg><span>INICIO</span>
      </a>
      <a href="#" id="igBtn" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg><span>INSTAGRAM</span>
      </a>
      <button class="request" id="requestBtn" type="button" aria-label="Pedir canción por WhatsApp">
        <svg viewBox="0 0 24 24"><path d="M20 11.2a8 8 0 0 1-11.8 7L4 20l1.8-4.1A8 8 0 1 1 20 11.2Z"/><path d="M8.8 9.2c.2-.4.4-.5.7-.5h.5c.2 0 .4.1.5.4l.7 1.6c.1.2.1.4-.1.6l-.5.6c.5 1 1.2 1.6 2.2 2.1l.6-.6c.2-.2.4-.2.7-.1l1.5.7c.3.1.4.3.4.6v.5c0 .3-.1.5-.5.7-.4.2-1.2.2-2-.1-1.1-.4-2.1-1-3-1.9-.9-.9-1.5-1.9-1.9-3-.3-.8-.3-1.6-.1-2Z"/></svg><span>PEDIDOS</span>
      </button>
      <a href="#" id="fbBtn" aria-label="Facebook">
        <svg viewBox="0 0 24 24"><path d="M14 21v-8h2.7l.4-3H14V8.1c0-.9.3-1.5 1.6-1.5h1.7V4a21 21 0 0 0-2.4-.1c-2.4 0-4 1.5-4 4.1V10H8v3h2.9v8"/></svg><span>FACEBOOK</span>
      </a>
      <a href="#" id="waNavBtn" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24"><path d="M20.5 3.5A11.6 11.6 0 0 0 12.2 0C5.8 0 .6 5.2.6 11.6c0 2 .5 3.9 1.5 5.6L.5 23.8l6.8-1.8c1.5.8 3.2 1.2 4.9 1.2h.1c6.4 0 11.6-5.2 11.6-11.6 0-3.1-1.2-6-3.4-8.1Z"/></svg><span>WHATSAPP</span>
      </a>
    </nav>
  </main>
  <audio id="radio" preload="none" crossorigin="anonymous"></audio>
  <div id="toast" class="toast" role="status"></div>
</div>
<script>
const STREAM = "https://stream.zeno.fm/lsjulxskzuztv";
const WHATSAPP = "34604875068";
const INSTAGRAM = "https://www.instagram.com/djkevin_inthemix?stkn=YzFhZDgwZnN3Nm5u";
const FACEBOOK = "https://www.facebook.com/share/19Vk6FEh96/";
const radio = document.getElementById('radio');
radio.src = STREAM;

const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const intro = document.getElementById('intro');
const video = document.getElementById('introVideo');
const introStart = document.getElementById('introStart');
const introHint = document.getElementById('introHint');
const playBtn = document.getElementById('playBtn');
const status = document.getElementById('status');
const desc = document.getElementById('desc');
const toast = document.getElementById('toast');
let introFinished = false;
let deferredPrompt = null;

function hideIntro(){
  if(introFinished) return;
  introFinished = true;
  intro.classList.add('hide');
  setTimeout(()=>{ intro.style.display='none'; },650);
}
function showToast(msg){
  toast.textContent=msg; toast.classList.add('show');
  clearTimeout(showToast.t); showToast.t=setTimeout(()=>toast.classList.remove('show'),2400);
}

if(isStandalone){
  introStart.style.display='none';
  introHint.textContent='Radio Party Online';
  video.muted = true;
  video.play().catch(()=>{});
  video.addEventListener('ended',hideIntro,{once:true});
  setTimeout(hideIntro,6500);
}else{
  video.muted = false;
  introStart.addEventListener('click', async ()=>{
    introStart.style.display='none';
    introHint.textContent='Disfruta la intro de Radio Party';
    try { await video.play(); } catch(e) { video.muted=true; await video.play().catch(()=>{}); }
  });
  video.addEventListener('ended',hideIntro,{once:true});
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && !introFinished && isStandalone) video.play().catch(()=>{});
});

async function toggleRadio(){
  if(radio.paused){
    try{
      status.textContent='Radio Party · Conectando…';
      desc.textContent='Conectando con la emisión en vivo.';
      await radio.play();
      status.textContent='Radio Party · En vivo';
      desc.textContent='Estás escuchando Radio Party Online.';
      playBtn.textContent='❚❚';
      playBtn.setAttribute('aria-label','Pausar Radio Party');
    }catch(err){
      status.textContent='No se pudo conectar';
      desc.textContent='Toca de nuevo para intentar la conexión.';
      showToast('No se pudo iniciar la radio');
    }
  }else{
    radio.pause();
    status.textContent='Radio Party · En pausa';
    desc.textContent='Pulsa el botón para volver a escuchar.';
    playBtn.textContent='▶';
    playBtn.setAttribute('aria-label','Reproducir Radio Party');
  }
}
playBtn.addEventListener('click',toggleRadio);
radio.addEventListener('error',()=>{ desc.textContent='La emisión no responde ahora. Intenta de nuevo.'; });
radio.addEventListener('playing',()=>{status.textContent='Radio Party · En vivo';desc.textContent='Estás escuchando Radio Party Online.';playBtn.textContent='❚❚';});
radio.addEventListener('pause',()=>{playBtn.textContent='▶';});

function pedido(){
  const text='Hola Radio Party 👋 Quiero hacer un pedido musical. Mi canción es: ';
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`,'_blank','noopener');
}
document.getElementById('requestBtn').addEventListener('click',pedido);
document.getElementById('waLink').href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hola Radio Party 👋 Quiero escribir a la radio.')}`;
document.getElementById('waNavBtn').href=document.getElementById('waLink').href;
document.getElementById('igBtn').href=INSTAGRAM;
document.getElementById('fbBtn').href=FACEBOOK;
document.getElementById('homeBtn').addEventListener('click',e=>{e.preventDefault();showToast('Estás en Inicio');});
document.getElementById('igBtn').addEventListener('click',()=>{});
document.getElementById('fbBtn').addEventListener('click',()=>{});

window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('installBtn').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click',async()=>{
  if(!deferredPrompt){showToast('Para instalar, usa el menú del navegador.');return;}
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('installBtn').classList.remove('show');
});
window.addEventListener('appinstalled',()=>{
  document.getElementById('installBtn').classList.remove('show');
  showToast('Radio Party quedó instalada');
});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
